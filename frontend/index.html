<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Educacional</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f5f7fa; color: #1d2733; }
    main { text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: .25rem; }
    #status { color: #5b6b7b; }
    #status.erro { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <h1 id="mensagem">Carregando...</h1>
    <p id="status">Consultando o backend...</p>
  </main>
  <script>
    fetch("/api/hello")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => {
        document.getElementById("mensagem").textContent = d.message;
        document.getElementById("status").textContent = "Resposta recebida do backend.";
      })
      .catch(e => {
        document.getElementById("mensagem").textContent = "Erro";
        const s = document.getElementById("status");
        s.textContent = "Não foi possível falar com o backend (" + e.message + ").";
        s.className = "erro";
      });
  </script>
</body>
</html>
