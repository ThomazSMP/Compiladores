name: compiladores-etapa3

services:
  backend:
    build:
      context: ./backend
      target: runtime
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/hello')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${PORTA_WEB:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---- Testes automatizados (só rodam quando pedidos explicitamente) ----
  backend-tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]

  frontend-tests:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: ["node", "--test", "tests/*.test.js"]
    profiles: ["test"]
